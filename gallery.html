<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery</title>
    <style>
      body { margin: 0; padding: 16px; background: #d9d9d9; color: #141414; font: 14px monospace; }
      h2 { margin: 18px 0 8px; font-size: 14px; text-transform: uppercase; }
      .grid { display: flex; flex-wrap: wrap; gap: 12px; }
      figure { margin: 0; text-align: center; }
      figure img, figure canvas { display: block; image-rendering: pixelated; border: 2px solid #141414; background: #fff; }
      figcaption { margin-top: 4px; }
    </style>
  </head>
  <body>
    <!-- A developer page: every detailed illustration in one place. Run `npm run dev` and open /gallery.html. -->
    <div id="gallery"></div>
    <script type="module" src="./src/gallery.ts"></script>
  </body>
</html>
